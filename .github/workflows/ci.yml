# =============================================================================
# SWE5006-Jiraffe: Secure Multi-Stage CI/CD Pipeline
# =============================================================================
# Pipeline Stages:
#   1. Build & Lint        - Fast feedback on code quality
#   2. Unit Tests          - Vitest with coverage
#   3. SCA (Security)      - npm audit + Trivy dependency scan
#   4. SAST (Security)     - SonarQube + CodeQL static analysis
#   5. Docker Build & Push - Container image to GHCR
#   6. Deploy to Staging   - Deploy to AWS EC2
#   7. SIT                 - Functional + Non-functional testing
#   8. DAST (Security)     - OWASP ZAP against running app
# =============================================================================
#
# PRIVATE REPO NOTES:
#   - GHCR images from private repos are private by default.
#     EC2 needs a PAT (GH_PAT secret) with read:packages scope to pull.
#   - CodeQL & Trivy SARIF upload require GitHub Advanced Security (GHAS).
#     Free with GitHub Education or GitHub Enterprise.
#     If you don't have GHAS, those steps will fail gracefully (continue-on-error).
# =============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "24.13.0"
  DOCKER_IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: write
  security-events: write
  actions: read

# ---------------------------------------------------------------------------
# STAGE 1: Build & Lint
# ---------------------------------------------------------------------------
jobs:
  build-and-lint:
    name: "Stage 1: Build & Lint"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build application
        run: npm run build
        env:
          MONGODB_URI: mongodb://localhost:27017/build-placeholder
          NEXTAUTH_SECRET: build-placeholder-secret

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .next/
          retention-days: 1

  # ---------------------------------------------------------------------------
  # STAGE 2: Unit Tests
  # ---------------------------------------------------------------------------
  unit-tests:
    name: "Stage 2: Unit Tests"
    runs-on: ubuntu-latest
    needs: build-and-lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 5

  # ---------------------------------------------------------------------------
  # STAGE 3: SCA – Software Composition Analysis
  # ---------------------------------------------------------------------------
  sca-npm-audit:
    name: "Stage 3a: SCA – npm audit"
    runs-on: ubuntu-latest
    needs: build-and-lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high || true
        # "|| true" prevents pipeline failure on known advisories.
        # Remove "|| true" to enforce strict zero-vulnerability policy.

      - name: Generate npm audit JSON report
        run: npm audit --json > npm-audit-report.json || true

      - name: Upload npm audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          retention-days: 30

  sca-trivy:
    name: "Stage 3b: SCA – Trivy Filesystem Scan"
    runs-on: ubuntu-latest
    needs: build-and-lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.31.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Run Trivy (SARIF output)
        uses: aquasecurity/trivy-action@0.31.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-sca-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy SARIF report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-sca-report
          path: trivy-sca-results.sarif
          retention-days: 30

  # ---------------------------------------------------------------------------
  # STAGE 4: SAST – Static Application Security Testing
  # ---------------------------------------------------------------------------
  sast-sonarqube:
    name: "Stage 4a: SAST – SonarQube"
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # NOTE: CodeQL (SAST) removed – requires GitHub Advanced Security (GHAS),
  # which is not available for private repos on GitHub Free.
  # SonarQube provides equivalent SAST coverage.

  # ---------------------------------------------------------------------------
  # STAGE 5: Docker Build & Push
  # ---------------------------------------------------------------------------
  docker-build:
    name: "Stage 5: Docker Build & Push"
    runs-on: ubuntu-latest
    needs: [unit-tests, sca-npm-audit, sca-trivy, sast-sonarqube]
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build-push.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@0.31.0
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0

  # ---------------------------------------------------------------------------
  # STAGE 6: Deploy to Staging (AWS EC2)
  # ---------------------------------------------------------------------------
  deploy-staging:
    name: "Stage 6: Deploy to Staging"
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          envs: DOCKER_IMAGE
          script: |
            cd /opt/jiraffe
            
            # GH_PAT is a Personal Access Token with read:packages scope.
            # Required because GITHUB_TOKEN is ephemeral and can't be used
            # outside the Actions runner (and GHCR is private for private repos).
            echo "${{ secrets.GH_PAT }}" | docker login ghcr.io -u ${{ secrets.GH_USERNAME }} --password-stdin
            
            docker pull ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
            
            # Update .env with new image tag and restart
            sed -i "s|^APP_IMAGE=.*|APP_IMAGE=${{ env.DOCKER_IMAGE }}:${{ github.sha }}|" .env
            docker compose --profile deploy -f docker-compose.prod.yml up -d app
            
            echo "Waiting for application to become healthy..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:3000 > /dev/null 2>&1; then
                echo "Application is healthy!"
                exit 0
              fi
              sleep 5
            done
            echo "WARNING: Health check timed out"
            exit 1

  # ---------------------------------------------------------------------------
  # STAGE 7: SIT – System Integration Testing
  # ---------------------------------------------------------------------------
  sit-functional:
    name: "Stage 7a: SIT – Functional Tests"
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API smoke tests
        run: |
          STAGING_URL="${{ secrets.STAGING_URL }}"
          
          echo "=== API Health Check ==="
          curl -sfk "${STAGING_URL}" || { echo "FAIL: App not reachable"; exit 1; }
          
          echo "=== Auth Endpoints ==="
          STATUS=$(curl -sk -o /dev/null -w "%{http_code}" "${STAGING_URL}/api/auth/providers")
          [ "$STATUS" -eq 200 ] && echo "PASS: /api/auth/providers ($STATUS)" || { echo "FAIL: /api/auth/providers ($STATUS)"; exit 1; }
          
          echo "=== Protected Endpoints (should return 401/redirect) ==="
          for endpoint in "/api/users" "/api/incidents" "/api/products" "/api/teams"; do
            STATUS=$(curl -sk -o /dev/null -w "%{http_code}" "${STAGING_URL}${endpoint}")
            echo "  ${endpoint}: $STATUS"
          done
          
          echo "=== All functional smoke tests passed ==="

      # Placeholder for Playwright/Cypress E2E tests when added
      # - name: Run E2E tests
      #   run: npx playwright test
      #   env:
      #     BASE_URL: ${{ secrets.STAGING_URL }}

  sit-nonfunctional:
    name: "Stage 7b: SIT – Non-Functional (Performance)"
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run k6 load test
        run: k6 run tests/performance/load-test.js
        env:
          K6_STAGING_URL: ${{ secrets.STAGING_URL }}

  # ---------------------------------------------------------------------------
  # STAGE 8: DAST – Dynamic Application Security Testing
  # ---------------------------------------------------------------------------
  dast-zap:
    name: "Stage 8: DAST – OWASP ZAP"
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ secrets.STAGING_URL }}
          rules_file_name: .zap/rules.tsv
          cmd_options: "-a"
          allow_issue_writing: true
          fail_action: false

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: report_html.html
          retention-days: 30
