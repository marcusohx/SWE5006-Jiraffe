sonar.projectKey=SWE5006-Jiraffe
sonar.projectName=SWE5006 Jiraffe

# Source configuration
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# TypeScript / JavaScript
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.sonar.json

# Exclusions
sonar.exclusions=.next/**,node_modules/**,coverage/**,tests/**,infra/**
sonar.test.exclusions=tests/**

# Coverage exclusions (match vitest.config.ts)
sonar.coverage.exclusions=src/app/**,src/components/**,src/hooks/**,src/lib/db/**,src/lib/mock-data.ts,src/lib/team-persistence.ts,src/lib/config.ts,src/middleware.ts,src/modules/**/*.model.ts,src/modules/auth/auth.options.ts,src/modules/auth/auth.controller.ts

# Quality Gate enforcement
sonar.qualitygate.wait=true

# Security-focused analysis (SAST rules)
sonar.security.hotspots.reviewed=true
